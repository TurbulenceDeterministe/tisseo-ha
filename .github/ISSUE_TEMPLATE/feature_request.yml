name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: "What would you like?"
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data source
      description: "Which public, keyless open-data source provides this? Features that need app-embedded keys or bypass tisseo.fr protections cannot be accepted."
