blueprint:
  name: Tisséo – time to leave
  description: >
    Runs your actions when a Tisséo **Leave now** binary sensor turns on (walking time +
    buffer reached for the next catchable departure). Set the walking time and buffer in
    the stop's options. Variables: `{{ line }}`, `{{ destination }}`, `{{ departure }}`, `{{ realtime }}`.
  domain: automation
  source_url: https://github.com/your-github-user/tisseo-ha/blob/main/blueprints/automation/tisseo/leave_now_notify.yaml
  input:
    leave_sensor:
      name: Leave-now sensor
      selector:
        entity:
          filter:
            - integration: tisseo
              domain: binary_sensor
    after:
      name: Only after
      default: "06:00:00"
      selector:
        time:
    before:
      name: Only before
      default: "10:00:00"
      selector:
        time:
    weekdays:
      name: Days
      default: [mon, tue, wed, thu, fri]
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    actions:
      name: Actions
      default:
        - action: persistent_notification.create
          data:
            title: "Leave now"
            message: "{{ line }} → {{ destination }} departs at {{ as_timestamp(departure) | timestamp_custom('%H:%M') }}{{ ' (live)' if realtime else '' }}"
      selector:
        action:
mode: single
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: !input leave_sensor
    from: "off"
    to: "on"
variables:
  sensor: !input leave_sensor
  nxt: "{{ state_attr(sensor, 'next_catchable') or {} }}"
  line: "{{ nxt.line | default('?') }}"
  destination: "{{ nxt.destination | default('') }}"
  departure: "{{ nxt.expected | default(now().isoformat()) }}"
  realtime: "{{ nxt.realtime | default(false) }}"
conditions:
  - condition: time
    after: !input after
    before: !input before
    weekday: !input weekdays
actions: !input actions
